<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorooq Salah Beauty Salon - المنيو الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- الهيدر -->
    <header class="header">
        <div class="header-bg"></div>
        <div class="header-content">
            <h1>SHOROOQ SALAH</h1>
            <p class="subtitle">BEAUTY SALON</p>
        </div>
    </header>

    <!-- حاوية مربعات الأقسام (Blocks Grid) -->
    <main class="blocks-container">
        <h2 class="section-title">أقسام الخدمات</h2>
        
        <div class="blocks-grid">
            <div class="category-block" onclick="openModal('bridal')">
                <i class="fa-solid fa-ring"></i>
                <h3>العروس</h3>
                <p>باكيجات العروس والخطبة</p>
            </div>

            <div class="category-block" onclick="openModal('makeup')">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <h3>المكياج</h3>
                <p>مكياج عيون ووجه كامل</p>
            </div>

            <div class="category-block" onclick="openModal('hair')">
                <i class="fa-solid fa-scissors"></i>
                <h3>الشعر</h3>
                <p>تساريح، قص، صبغة، وفرد</p>
            </div>

            <div class="category-block" onclick="openModal('face')">
                <i class="fa-solid fa-spa"></i>
                <h3>إزالة شعر الوجه</h3>
                <p>واكس، خيط، وديرمابلانينج</p>
            </div>

            <div class="category-block" onclick="openModal('lashes')">
                <i class="fa-solid fa-eye"></i>
                <h3>الرموش والحواجب</h3>
                <p>رفع وتوسيع وتركيب رموش</p>
            </div>
        </div>
    </main>

    <!-- النافذة المنبثقة (Pop-up Modal) -->
    <div id="serviceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">عنوان القسم</h2>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- سيتم تعبئة الخدمات هنا تلقائياً -->
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p>© 2026 Shorooq Salah Beauty Salon. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- بيانات الخدمات والسكريبت -->
    <script>

                title: "العروس",

                    { name: "باكيج عروس أبيض (1)", desc: "مكياج + تسريحة + بدي فاونديشن + تلبيس البدلة", price: "٢٠٠ دينار" },
                    { name: "باكيج عروس أبيض (2)", desc: "مكياج + تسريحة + بدي فاونديشن + اكستنشن حراري + أظافر (تركيب) لون عادي", price: "٢٥٠ دينار" },
                    { name: "باكيج عروس أبيض (3)", desc: "مكياج + تسريحة + بدي فاونديشن + اكستنشن حراري + أظافر جل كلر", price: "٣٠٠ دينار" },
                    { name: "عروس خطبة", desc: "مكياج + تسريحة + تلبيس بدلة", price: "١٥٠ دينار" }
                ]
            },

                    { name: "مكياج وجه كامل بدون رموش", desc: "", price: "٢٠ دينار" },
                    { name: "مكياج وجه كامل مع رموش", desc: "", price: "٢٥ دينار" }
                ]
            },
            hair: {
                title: "الشعر (تساريح، قص، صبغة، وعناية)",
                items: [
                    { name: "حمام الشعر", desc: "", price: "٢ دينار" },
                    { name: "ويفي ستايل", desc: "", price: "١٥ دينار" },
                    { name: "ريترو ستايل", desc: "", price: "١٥ دينار" },
                    { name: "تساريح نص رفع", desc: "", price: "٢٠ دينار" },
                    { name: "تساريح رفع كامل", desc: "", price: "٢٠ دينار" },
                    { name: "تسريحة رفع / نص رفع أطفال", desc: "", price: "١٥ دينار" },

                    { name: "سشوار ويفي", desc: "إضافة على السشوار", price: "+٢ دينار" },
                    { name: "غرة ستريت", desc: "", price: "مجاناً" },

                    { name: "أطراف الشعر", desc: "", price: "٣ دنانير" },
                    { name: "قصة كاملة", desc: "", price: "٥ دنانير" },
                    { name: "قص شعر كيرلي", desc: "", price: "٧ دنانير" },

                    { name: "تست قبل الصبغة واستشارة", desc: "", price: "مجاني" },
                    { name: "صبغة جذور", desc: "يشمل رينس مجاني", price: "١٠ دنانير" },
                    { name: "صبغة لون واحد", desc: "باستخدام مواد الزبونة", price: "٥ - ٧ دنانير" },
                    { name: "صبغة لون واحد بدون سحب لون", desc: "حسب الطول والكثافة", price: "١٥ - ٤٠ دينار" },
                    { name: "إضافة سحب لون", desc: "", price: "٢٠ - ٣٠ دينار" },
                    { name: "تخصيل الشعر بجميع أشكاله", desc: "ابتداءً من", price: "٥٠ دينار" },
                    { name: "جلسة ديتوكس فروة الرأس", desc: "", price: "١٥ دينار" },
                    { name: "جلسة كيو ويب للتغذية والترطيب العميق", desc: "", price: "١٥ دينار" },
                    { name: "جلسة زيت بذور العنب للترطيب الداخلي", desc: "", price: "١٠ دنانير" },
                    { name: "باكيج ديتوكس فروة الرأس + جلسة كيو ويب", desc: "", price: "٢٣ دينار" },
                    { name: "باكيج ديتوكس فروة الرأس + جلسة بذور العنب", desc: "", price: "٢٠ دينار" },
                    { name: "إضافة قص + سشوار إلى جلسات العناية", desc: "", price: "٥ دنانير" },
                    { name: "فرد بمادة ماء الذهب", desc: "حسب الطول والكثافة", price: "ابتداءً من ٥٠ دينار" },
                    { name: "فرد بمادة بوتوكس الشعر", desc: "حسب الطول والكثافة", price: "ابتداءً من ٣٥ دينار" }
                ]
            },
            face: {
                title: "إزالة شعر الوجه",
                items: [
                    { name: "واكس الوجه كامل", desc: "", price: "٥ دنانير" },
                    { name: "واكس الوجه مع أسفل الذقن والرقبة", desc: "", price: "٧ دنانير" },
                    { name: "خيط وجه كامل", desc: "", price: "٥ دنانير" },
                    { name: "حواجب", desc: "", price: "٢ دينار" },
                    { name: "شوارب", desc: "", price: "١ دينار" },
                    { name: "إزالة شعر الوجه بالديرمابلانينج", desc: "", price: "١٠ دنانير" },
                    { name: "إزالة شعر الوجه بالشيفنج (فلامينجو)", desc: "", price: "٣ دنانير" }
                ]
            },
            lashes: {
                title: "تجميل الرموش والحواجب",
                items: [
                    { name: "رفع الرموش LVL", desc: "", price: "١٥ دينار" },
                    { name: "رفع الحواجب (هافانا) مع تشقير", desc: "", price: "١٥ دينار" },
                    { name: "رفع الرموش + حواجب", desc: "", price: "٢٥ دينار" },
                    { name: "تشقير الحواجب بدون رفع", desc: "", price: "٥ دنانير" },
                    { name: "تركيب رموش لاين يومي", desc: "", price: "٣ دنانير" },
                    { name: "تركيب رموش أسبوعي", desc: "", price: "١٠ دنانير" },
                    { name: "تركيب رموش شهري كلاسيك", desc: "", price: "٢٥ دينار" },
                    { name: "تركيب رموش شهري هايبرد", desc: "", price: "٣٠ دينار" },
                    { name: "تركيب رموش شهري فوليوم", desc: "", price: "٤٠ دينار" },
                    { name: "تركيب رموش شهري سيلك", desc: "", price: "٥٠ دينار" }
                ]
            }
        };

        function openModal(categoryKey) {
            const category = servicesData[categoryKey];
            document.getElementById('modalTitle').innerText = category.title;
            
            let html = '';
            category.items.forEach(item => {
                html += `
                    <div class="modal-item">
                        <div class="modal-item-info">
                            <h4>${item.name}</h4>
                            ${item.desc ? `<p>${item.desc}</p>` : ''}
                        </div>
                        <div class="modal-item-price">${item.price}</div>
                    </div>
                `;
            });

            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('serviceModal').style.display = 'block';
            document.body.style.overflow = 'hidden'; // منع التمرير للخلفية
        }

        function closeModal() {
            document.getElementById('serviceModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // إغلاق النافذة عند الضغط خارجها
        window.onclick = function(event) {
            const modal = document.getElementById('serviceModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
