        function renderMenu() {
            const data = translations[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = data.btnText;
            document.getElementById('connectTitle').innerText = data.connect;
            document.getElementById('locationText').innerText = data.location;
            document.getElementById('footerText').innerText = data.footer;

            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            data.categories.forEach(cat => {
                const isOpen = openSectionId === cat.id;
                let itemsHtml = cat.items.map(item => `
                    <div class="service-item">
                        <span>${item.name}</span>
                        <span class="price">${item.price}</span>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="category-card ${isOpen ? 'active' : ''}" onclick="toggleSection('${cat.id}')">
                        <div class="card-header">
                            <i class="fa-solid ${cat.icon}"></i>
                            <h2>${cat.title}</h2>
                            <i class="fa-solid fa-chevron-down arrow"></i>
                        </div>
                        <div id="${cat.id}" class="card-content" style="display: ${isOpen ? 'block' : 'none'};">
                            ${itemsHtml}
                        </div>
                    </div>
                `;
            });
        }

        function toggleSection(id) {
            openSectionId = (openSectionId === id) ? null : id;
            renderMenu();
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'ar') ? 'en' : 'ar';
            renderMenu();
        }
